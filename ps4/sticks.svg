<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 85" width="85" height="85">
  <defs>
    <radialGradient id="stickOuter" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#5b21b6"/>
      <stop offset="60%"  stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0a0015"/>
    </radialGradient>
    <radialGradient id="stickInner" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="50%"  stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e0050"/>
    </radialGradient>
    <radialGradient id="stickShine" cx="35%" cy="25%" r="40%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="42.5" cy="42.5" r="40" fill="url(#stickOuter)" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner pad -->
  <circle cx="42.5" cy="42.5" r="28" fill="url(#stickInner)" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Shine -->
  <circle cx="42.5" cy="42.5" r="28" fill="url(#stickShine)"/>
  <!-- Centre dot -->
  <circle cx="42.5" cy="42.5" r="5" fill="rgba(255,255,255,0.3)"/>
</svg>
