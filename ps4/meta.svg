<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42">
  <defs>
    <radialGradient id="psGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#f472b6"/>
      <stop offset="50%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#1e0050"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- PS button circle -->
  <circle cx="21" cy="21" r="19" fill="url(#psGrad)" stroke="#f9a8d4" stroke-width="1.5" filter="url(#glow)"/>
  <!-- PS logo text -->
  <text x="21" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="16"
        fill="white" text-anchor="middle" opacity="0.95">PS</text>
  <!-- Shine -->
  <ellipse cx="16" cy="14" rx="7" ry="4" fill="rgba(255,255,255,0.2)" transform="rotate(-25 16 14)"/>
</svg>
