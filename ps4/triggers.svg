<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587 85" width="587" height="85">
  <defs>
    <radialGradient id="trigL" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="60%"  stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <radialGradient id="trigR" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#f472b6"/>
      <stop offset="60%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left trigger (L2) -->
  <path d="M 4,84 L 4,30 C 4,15 15,4 30,4 L 92,4 C 107,4 115,12 115,27 L 96,84 Z"
        fill="url(#trigL)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#glow)"/>
  <!-- L2 inner shine -->
  <path d="M 20,15 C 35,10 70,8 88,15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <!-- L2 label -->
  <text x="58" y="52" font-family="monospace" font-weight="bold" font-size="18" fill="white" text-anchor="middle" opacity="0.9">L2</text>

  <!-- Right trigger (R2) -->
  <path d="M 583,84 L 583,30 C 583,15 572,4 557,4 L 495,4 C 480,4 472,12 472,27 L 491,84 Z"
        fill="url(#trigR)" stroke="#f9a8d4" stroke-width="1.5" filter="url(#glow)"/>
  <!-- R2 inner shine -->
  <path d="M 567,15 C 552,10 517,8 499,15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <!-- R2 label -->
  <text x="529" y="52" font-family="monospace" font-weight="bold" font-size="18" fill="white" text-anchor="middle" opacity="0.9">R2</text>
</svg>
