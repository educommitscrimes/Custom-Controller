<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="crossGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="circleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="squareGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="triGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <filter id="btnGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Square (□) — top-left — violet/pink -->
  <circle cx="25" cy="50" r="18" fill="url(#squareGrad)" stroke="#ddd6fe" stroke-width="1.5" filter="url(#btnGlow)"/>
  <rect x="17" y="42" width="16" height="16" rx="2" fill="white" opacity="0.9"/>

  <!-- Triangle (△) — top — teal -->
  <circle cx="50" cy="25" r="18" fill="url(#triGrad)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#btnGlow)"/>
  <polygon points="50,14 60,32 40,32" fill="white" opacity="0.9"/>

  <!-- Cross (×) — bottom — blue -->
  <circle cx="50" cy="75" r="18" fill="url(#crossGrad)" stroke="#bfdbfe" stroke-width="1.5" filter="url(#btnGlow)"/>
  <line x1="43" y1="68" x2="57" y2="82" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="57" y1="68" x2="43" y2="82" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Circle (○) — right — red/pink -->
  <circle cx="75" cy="50" r="18" fill="url(#circleGrad)" stroke="#fecaca" stroke-width="1.5" filter="url(#btnGlow)"/>
  <circle cx="75" cy="50" r="9" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
</svg>
