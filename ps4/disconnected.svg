<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 500" width="806" height="500">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a0a3e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#04000f" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark overlay matching controller shape -->
  <path d="
    M 190,100 C 160,85 120,80 95,90 C 60,100 35,115 20,145 C 5,175 2,200 2,230 L 2,280 C 2,310 5,340 20,365 C 40,395 70,420 100,435 C 130,450 160,455 185,455 C 210,455 230,445 245,430 C 265,410 275,390 280,370 C 285,350 287,335 320,325 C 355,315 403,315 403,315 C 403,315 451,315 486,325 C 519,335 521,350 526,370 C 531,390 541,410 561,430 C 576,445 596,455 621,455 C 646,455 676,450 706,435 C 736,420 766,395 786,365 C 801,340 804,310 804,280 L 804,230 C 804,200 801,175 786,145 C 771,115 746,100 711,90 C 686,80 646,85 616,100 C 590,112 575,120 560,118 C 540,115 510,105 480,100 C 460,96 440,94 403,94 C 366,94 346,96 326,100 C 296,105 266,115 246,118 C 231,120 216,112 190,100 Z
  " fill="url(#discGrad)"/>

  <!-- Disconnected icon — broken plug symbol -->
  <g transform="translate(355,180)">
    <!-- Controller icon outline -->
    <text x="48" y="55" font-family="Arial" font-size="48" text-anchor="middle" fill="#4c1d95" opacity="0.8">⊘</text>
  </g>

  <!-- "DISCONNECTED" text -->
  <text x="403" y="310" font-family="monospace" font-weight="bold" font-size="16"
        fill="#7c3aed" text-anchor="middle" letter-spacing="4" opacity="0.8"
        filter="url(#glow)">DISCONNECTED</text>

  <!-- Pulsing ring around icon -->
  <circle cx="403" cy="230" r="55" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>
  <circle cx="403" cy="230" r="40" fill="none" stroke="#3730a3" stroke-width="1" opacity="0.3"/>
</svg>
