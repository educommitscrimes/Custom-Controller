<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="30" height="30">
  <defs>
    <radialGradient id="btnGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Round button -->
  <circle cx="15" cy="15" r="12" fill="url(#btnGrad)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Three horizontal lines (options icon) -->
  <line x1="9" y1="11" x2="21" y2="11" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="9" y1="15" x2="21" y2="15" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="9" y1="19" x2="21" y2="19" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
