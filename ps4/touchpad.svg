<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 151" width="262" height="151">
  <defs>
    <radialGradient id="tpadGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e0050" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Touchpad area highlight when pressed -->
  <rect x="2" y="2" width="258" height="147" rx="16" ry="16"
        fill="url(#tpadGrad)" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner glow pulse ring -->
  <rect x="10" y="10" width="242" height="131" rx="12" ry="12"
        fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
  <!-- Fingerprint ripple lines -->
  <ellipse cx="131" cy="75" rx="50" ry="28" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <ellipse cx="131" cy="75" rx="35" ry="18" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35"/>
  <ellipse cx="131" cy="75" rx="18" ry="9"  fill="none" stroke="#ddd6fe" stroke-width="1" opacity="0.3"/>
</svg>
